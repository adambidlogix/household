<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simmonds-Taylor Household</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root {
  --bg: #0f1117;
  --bg2: #181c25;
  --bg3: #1f2433;
  --bg4: #252b3b;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --border3: rgba(255,255,255,0.2);
  --text: #e8eaf0;
  --text2: #9097aa;
  --text3: #4e5566;
  --radius: 10px;
  --radius-sm: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; padding-bottom: 5rem; }

header { padding: 1.5rem 1.25rem 0; display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 17px; font-weight: 500; color: var(--text2); letter-spacing: -0.2px; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); transition: all .3s; }
.sync-dot.live { background: #639922; box-shadow: 0 0 0 3px rgba(99,153,34,0.18); }
.sync-dot.saving { background: #BA7517; }

.tab-row { display: flex; gap: 3px; padding: 1.25rem 1.25rem 0; overflow-x: auto; scrollbar-width: none; }
.tab-row::-webkit-scrollbar { display: none; }
.tab { padding: 7px 14px; border-radius: 20px; font-size: 15px; cursor: pointer; background: transparent; border: 0.5px solid var(--border); color: var(--text3); white-space: nowrap; transition: all .15s; position: relative; }
.tab:hover:not(.active) { background: var(--bg2); color: var(--text2); }
.tab.active { background: var(--bg3); color: var(--text); border-color: var(--border2); font-weight: 500; }
.tab.today::after { content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: #639922; }

.view { padding: 1.25rem 1.25rem 0; }

.day-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 1rem; }
.day-name { font-size: 22px; font-weight: 500; letter-spacing: -0.5px; }
.day-date { font-size: 13px; color: var(--text3); }
.day-progress { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.prog-track { width: 70px; height: 3px; background: var(--border2); border-radius: 2px; overflow: hidden; }
.prog-fill { height: 100%; background: var(--text3); border-radius: 2px; transition: width .3s; }
.prog-count { font-size: 12px; color: var(--text3); min-width: 28px; text-align: right; }

.filter-row { display: flex; align-items: center; gap: 5px; margin-bottom: 1rem; }
.filter { padding: 5px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 0.5px solid var(--border); background: transparent; color: var(--text3); transition: all .12s; }
.filter.active { border-color: var(--border2); color: var(--text); background: var(--bg3); }
.filter.adam.active { background: #0a2240; border-color: #185FA5; color: #85B7EB; }
.filter.sophie.active { background: #2e0d1a; border-color: #993556; color: #ED93B1; }
.reset-btn { font-size: 11px; color: var(--text3); background: none; border: none; cursor: pointer; padding: 3px 6px; border-radius: var(--radius-sm); margin-left: auto; }
.reset-btn:hover { color: var(--text2); background: var(--bg2); }

.section-label { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin: 1.25rem 0 .65rem; }

.tasks { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 7px; }

.task { padding: 11px 13px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); transition: border-color .15s; }
.task:hover { border-color: var(--border2); }
.task.done { opacity: .35; }
.task-top { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
.check { width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--border3); flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; transition: all .15s; }
.check.on { background: var(--text); border-color: var(--text); }
.cm { width: 8px; height: 5px; border-left: 1.5px solid #0f1117; border-bottom: 1.5px solid #0f1117; transform: rotate(-45deg) translate(1px,-1px); opacity: 0; }
.check.on .cm { opacity: 1; }
.task-label { font-size: 15px; color: var(--text); line-height: 1.4; flex: 1; }
.task.done .task-label { text-decoration: line-through; }

.task-meta { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 7px; padding-top: 7px; border-top: 0.5px solid var(--border); }
.pill { font-size: 12px; padding: 3px 8px; border-radius: 20px; cursor: pointer; border: 0.5px solid var(--border); color: var(--text3); background: transparent; transition: all .12s; white-space: nowrap; }
.pill:hover { border-color: var(--border2); color: var(--text2); }
.pill.adam { background: #0a2240; border-color: #185FA5; color: #85B7EB; }
.pill.sophie { background: #2e0d1a; border-color: #993556; color: #ED93B1; }
.pill.both { background: #111f07; border-color: #3B6D11; color: #97C459; }
.pill.day-set { background: #201208; border-color: #854F0B; color: #EF9F27; }

.day-wrap { position: relative; }
.day-dd { position: absolute; top: calc(100% + 4px); left: 0; background: var(--bg4); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); z-index: 99; min-width: 85px; overflow: hidden; }
.day-opt { padding: 5px 11px; font-size: 12px; cursor: pointer; color: var(--text); white-space: nowrap; }
.day-opt:hover { background: var(--bg3); }
.day-opt.cur { color: #EF9F27; }

.unsched-btn { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 8px 0 2px; color: var(--text3); font-size: 12px; border: none; background: none; }
.unsched-btn:hover { color: var(--text2); }
.arr { display: inline-block; transition: transform .2s; font-style: normal; }
.arr.open { transform: rotate(90deg); }
</style>
</head>
<body>

<header>
  <h1>Simmonds-Taylor Household</h1>
  <div class="sync-dot" id="sync-dot"></div>
</header>

<div class="tab-row" id="tab-row"></div>
<div class="view" id="view"></div>

<script>
const SB_URL = 'https://qgphrpjgzlfjbzjubkbu.supabase.co';
const SB_KEY = 'sb_publishable_A3MBtrD9j25kntadeu5oMg_vV2N1pfc';
const db = supabase.createClient(SB_URL, SB_KEY);

const DAY_KEYS  = ['mon','tue','wed','thu','fri','sat','sun'];
const DAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DAY_SHORT = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const WHO = ['adam','sophie','both'];
const WHO_LABEL = {adam:'Adam',sophie:'Sophie',both:'Both'};

const DAILY   = ['Kids up','Breakfast','Kids changed','Lunch','Dinner','Homeschooling','Dishwasher','Bedtime','House daily clean','Bathroom daily wipe','Washing','Rubbish out'];
const WEEKLY  = ['House mega tidy','Hoovering','Bathtime','Bathroom deep clean','Kitchen deep clean',"Children's appointments",'Change bedding','School admin','Financial admin','Decluttering','Home school planning','Activity planning','Exercise planning','Emotional wellbeing','Charity shop runs','Tip runs'];
const MONTHLY = ['Clothes shopping','Holiday planning','New furniture planning','Home improvements planning','Cut grass','Garden tidy','Equipment planning'];
const YEARLY  = ['Spring clean','Powerwash decking','Oil decking','Paint fence','Decorate'];

function slug(t){ return t.toLowerCase().replace(/[^a-z0-9]+/g,'_'); }
function todayKey(){ return DAY_KEYS[(new Date().getDay()+6)%7]; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function weekStr(){
  const d=new Date(), day=d.getDay()||7;
  d.setDate(d.getDate()+4-day);
  const y=d.getFullYear(), w=Math.ceil(((d-new Date(y,0,1))/86400000+1)/7);
  return y+'-W'+String(w).padStart(2,'0');
}

let current = todayKey();
let filterWho = 'all';
let unschedOpen = false;
let openDayMenu = null;
let saveTimers = {};

let S = {
  daily_chk:{}, weekly_chk:{}, monthly_chk:{}, yearly_chk:{},
  daily_tags:{}, weekly_tags:{}, monthly_tags:{}, yearly_tags:{},
  meta:{}
};

const dot = document.getElementById('sync-dot');
function setDot(s){ dot.className='sync-dot'+(s?' '+s:''); }

async function loadAll(){
  try {
    const {data} = await db.from('household_state').select('key,value');
    if(data) data.forEach(r=>{ if(r.key in S) S[r.key]=r.value||{}; });
    setDot('live');
  } catch(e){ console.warn(e); }
  autoReset();
  render();
  subscribeRT();
}

function autoReset(){
  const today=todayStr(), week=weekStr();
  let dirty=[];
  DAY_KEYS.forEach(d=>{
    if(S.meta['dr_'+d]!==today){ S.daily_chk[d]={}; S.meta['dr_'+d]=today; if(!dirty.includes('daily_chk')) dirty.push('daily_chk'); dirty.push('meta'); }
  });
  if(S.meta.wr!==week){ S.weekly_chk={}; S.meta.wr=week; if(!dirty.includes('weekly_chk')) dirty.push('weekly_chk'); if(!dirty.includes('meta')) dirty.push('meta'); }
  dirty.forEach(k=>scheduleSave(k));
}

function scheduleSave(key){
  setDot('saving');
  clearTimeout(saveTimers[key]);
  saveTimers[key]=setTimeout(async()=>{
    try{ await db.from('household_state').upsert([{key,value:S[key]}]); setDot('live'); }
    catch(e){ console.warn(e); setDot(''); }
  },700);
}

function subscribeRT(){
  db.channel('hh').on('postgres_changes',{event:'*',schema:'public',table:'household_state'},p=>{
    const r=p.new; if(r&&r.key&&r.key in S){ S[r.key]=r.value||{}; buildView(); }
  }).subscribe();
}

function buildTabs(){
  const today=todayKey();
  const todayIdx=DAY_KEYS.indexOf(today);
  document.getElementById('tab-row').innerHTML=
    [...DAY_KEYS,'monthly','yearly'].map(k=>{
      const isDay=DAY_KEYS.includes(k);
      const label=isDay?DAY_SHORT[DAY_KEYS.indexOf(k)]:(k.charAt(0).toUpperCase()+k.slice(1));
      const isToday=k===today;
      return `<button class="tab${k===current?' active':''}${isToday?' today':''}" onclick="setTab('${k}')">${label}</button>`;
    }).join('');
}

function buildView(){
  const el=document.getElementById('view');
  const isDay=DAY_KEYS.includes(current);

  if(isDay){
    const di=DAY_KEYS.indexOf(current);
    const todayIdx=(new Date().getDay()+6)%7;
    const d=new Date(); d.setDate(d.getDate()+(di-todayIdx));
    const dateStr=d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    const dChk=S.daily_chk[current]||{};
    const wChk=S.weekly_chk||{};
    const wTags=S.weekly_tags||{};
    const dTags=S.daily_tags||{};
    const scheduled=WEEKLY.filter(t=>wTags[slug(t)]?.day===DAY_SHORT[di]);
    const unscheduled=WEEKLY.filter(t=>!wTags[slug(t)]?.day);
    const visDaily=applyFilter(DAILY,dTags);
    const visWeekly=applyFilter(scheduled,wTags);
    const total=visDaily.length+visWeekly.length;
    const done=visDaily.filter(t=>dChk[slug(t)]).length+visWeekly.filter(t=>wChk[slug(t)]).length;
    const pct=total?Math.round(done/total*100):0;

    el.innerHTML=`
      <div class="day-header">
        <span class="day-name">${DAY_NAMES[di]}</span>
        <span class="day-date">${dateStr}</span>
        <div class="day-progress">
          <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
          <span class="prog-count">${done}/${total}</span>
        </div>
      </div>
      <div class="filter-row">
        <button class="filter${filterWho==='all'?' active':''}" onclick="setFilter('all')">All</button>
        <button class="filter adam${filterWho==='adam'?' active':''}" onclick="setFilter('adam')">Adam</button>
        <button class="filter sophie${filterWho==='sophie'?' active':''}" onclick="setFilter('sophie')">Sophie</button>
        <button class="reset-btn" onclick="resetDay()">↺ reset day</button>
      </div>
      <div class="section-label">Every day</div>
      <div class="tasks" id="tl-daily"></div>
      ${scheduled.length?`<div class="section-label">This week</div><div class="tasks" id="tl-weekly"></div>`:''}
      ${unscheduled.length?`<button class="unsched-btn" onclick="toggleUnsched()"><i class="arr${unschedOpen?' open':''}">▶</i> Unscheduled weekly (${unscheduled.length})</button>${unschedOpen?'<div class="tasks" id="tl-unsched" style="margin-top:.65rem"></div>':''}` : ''}
    `;
    renderList('tl-daily',DAILY,dChk,dTags,'daily',false);
    if(scheduled.length) renderList('tl-weekly',scheduled,wChk,wTags,'weekly',true);
    if(unschedOpen&&unscheduled.length) renderList('tl-unsched',unscheduled,wChk,wTags,'weekly',true);

  } else {
    const isM=current==='monthly';
    const tasks=isM?MONTHLY:YEARLY;
    const ck=isM?'monthly_chk':'yearly_chk';
    const tk=isM?'monthly_tags':'yearly_tags';
    const chk=S[ck]||{}, tgs=S[tk]||{};
    const vis=applyFilter(tasks,tgs);
    const done=vis.filter(t=>chk[slug(t)]).length;
    const pct=vis.length?Math.round(done/vis.length*100):0;
    el.innerHTML=`
      <div class="day-header">
        <span class="day-name">${current.charAt(0).toUpperCase()+current.slice(1)}</span>
        <div class="day-progress">
          <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
          <span class="prog-count">${done}/${vis.length}</span>
        </div>
        <button class="reset-btn" style="margin-left:8px" onclick="resetPeriod('${ck}')">↺ reset</button>
      </div>
      <div class="filter-row">
        <button class="filter${filterWho==='all'?' active':''}" onclick="setFilter('all')">All</button>
        <button class="filter adam${filterWho==='adam'?' active':''}" onclick="setFilter('adam')">Adam</button>
        <button class="filter sophie${filterWho==='sophie'?' active':''}" onclick="setFilter('sophie')">Sophie</button>
      </div>
      <div class="tasks" id="tl-period"></div>
    `;
    renderList('tl-period',tasks,chk,tgs,current,false);
  }
}

function applyFilter(tasks,tags){
  if(filterWho==='all') return tasks;
  return tasks.filter(t=>{ const w=tags[slug(t)]?.who; return w===filterWho||w==='both'||!w; });
}

function renderList(id,tasks,chk,tags,period,showDay){
  const el=document.getElementById(id); if(!el) return;
  const vis=applyFilter(tasks,tags);
  if(!vis.length){ el.innerHTML=`<div style="font-size:13px;color:var(--text3);padding:.25rem 0">No tasks here.</div>`; return; }
  el.innerHTML=vis.map(t=>{
    const s=slug(t), isDone=!!chk[s], who=tags[s]?.who||null, day=tags[s]?.day||null;
    return `<div class="task${isDone?' done':''}">
      <div class="task-top" onclick="toggle('${period}','${t.replace(/'/g,"\\'")}')">
        <div class="check${isDone?' on':''}"><div class="cm"></div></div>
        <span class="task-label">${t}</span>
      </div>
      <div class="task-meta">
        <button class="pill${who?' '+who:''}" onclick="cycleWho('${period}','${t.replace(/'/g,"\\'")}')">
          ${who?WHO_LABEL[who]:'+ who'}
        </button>
        ${showDay?`<div class="day-wrap">
          <button class="pill${day?' day-set':''}" onclick="toggleDayDD(event,'${s}')">${day||'+ day'}</button>
          <div class="day-dd" id="dd_${s}" style="display:none">
            <div class="day-opt${!day?' cur':''}" onclick="setDay(event,'${t.replace(/'/g,"\\'")}',null)">— clear</div>
            ${DAY_SHORT.map(d=>`<div class="day-opt${day===d?' cur':''}" onclick="setDay(event,'${t.replace(/'/g,"\\'")}','${d}')">${d}</div>`).join('')}
          </div>
        </div>`:''}
      </div>
    </div>`;
  }).join('');
}

function render(){ buildTabs(); buildView(); }

window.setTab=k=>{current=k;filterWho='all';unschedOpen=false;render();};
window.setFilter=w=>{filterWho=w;buildTabs();buildView();};
window.toggleUnsched=()=>{unschedOpen=!unschedOpen;buildView();};

window.toggle=(period,t)=>{
  const s=slug(t);
  if(period==='daily'){
    if(!S.daily_chk[current]) S.daily_chk[current]={};
    S.daily_chk[current][s]=!S.daily_chk[current][s];
    scheduleSave('daily_chk');
  } else {
    const ck=period+'_chk';
    S[ck][s]=!S[ck][s];
    scheduleSave(ck);
  }
  buildView();
};

window.cycleWho=(period,t)=>{
  const s=slug(t), tk=period+'_tags';
  if(!S[tk][s]) S[tk][s]={};
  const c=S[tk][s].who||null, idx=c?WHO.indexOf(c):-1, next=idx<WHO.length-1?WHO[idx+1]:null;
  if(next) S[tk][s].who=next; else delete S[tk][s].who;
  scheduleSave(tk); buildView();
};

window.toggleDayDD=(e,s)=>{
  e.stopPropagation();
  if(openDayMenu&&openDayMenu!==s){ const o=document.getElementById('dd_'+openDayMenu); if(o) o.style.display='none'; }
  const dd=document.getElementById('dd_'+s); if(!dd) return;
  const open=dd.style.display!=='none'; dd.style.display=open?'none':'block';
  openDayMenu=open?null:s;
};

window.setDay=(e,t,day)=>{
  e.stopPropagation();
  const s=slug(t), tk='weekly_tags';
  if(!S[tk][s]) S[tk][s]={};
  if(day) S[tk][s].day=day; else delete S[tk][s].day;
  scheduleSave(tk);
  const dd=document.getElementById('dd_'+s); if(dd) dd.style.display='none';
  openDayMenu=null; buildView();
};

window.resetDay=()=>{ S.daily_chk[current]={}; scheduleSave('daily_chk'); buildView(); };
window.resetPeriod=ck=>{ S[ck]={}; scheduleSave(ck); buildView(); };

document.addEventListener('click',()=>{
  if(openDayMenu){ const dd=document.getElementById('dd_'+openDayMenu); if(dd) dd.style.display='none'; openDayMenu=null; }
});

loadAll();
</script>
</body>
</html>
